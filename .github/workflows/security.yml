name: security

# Репозиторий публичный: проверяем историю на секреты, дерево — на ключи и сборки,
# а прошивку — на то, что она вообще собирается без локальных Secrets.h.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Запрещённые файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ключи, секреты стенда и артефакты сборки не должны попадать в git
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|der|token)$|(^|/)Secrets\.h$|^\.dev/' || true)
          if [ -n "$bad" ]; then
            echo "Эти файлы не должны быть в репозитории:"
            echo "$bad"
            exit 1
          fi

  firmware:
    name: Сборка прошивки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade platformio
      # Secrets.h в репозитории нет и быть не должно: собираем на заглушках,
      # они дают «безопасный отказ» — TLS не поднимется, но прошивка соберётся.
      - run: cp firmware/src/config/Secrets.example.h firmware/src/config/Secrets.h
      - name: Сборка под серийный профиль
        working-directory: firmware
        run: pio run -e esp32s3_prod
