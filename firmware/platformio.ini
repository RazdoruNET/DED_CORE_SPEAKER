[platformio]
default_envs = esp32da

; DED CORE SPEAKER. Один код — два профиля платы:
;   esp32da   — ESP32-WROOM-DA (ESP32-D0WD-V3, 240 МГц, 4 МБ флеша, без PSRAM)
;   esp32s3   — ESP32-S3-WROOM-1 N16R8 (продукт: AEC, медиа, полный дуплекс)
;
; Профиль задаётся флагом DEVICE_PROFILE_DA / DEVICE_PROFILE_S3 и меняет только
; возможности (набор задач, аудио-бэкенд, лимиты), а не структуру кода.

[env]
; Версия платформы закреплена намеренно. Без неё PlatformIO ставит свежий
; espressif32 (8.0.0 с Arduino core 3.x), где убраны API, на которых держится
; прошивка (ledcSetup/ledcAttachPin, mbedtls_sha256_*_ret), и сборка падает.
; На железе проверено это ядро: Arduino 2.0.17 / IDF 4.4.
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; mbedTLS здесь НЕ перенастраиваем. Эти константы задают размеры полей
    ; внутри mbedtls_ssl_context, а сама библиотека в ядре предсобрана со
    ; значениями по умолчанию. Переопределение через -D даёт молчаливое
    ; рассогласование структур и мусор при проверке сертификата
    ; (флаги 0xffffffff, «сертификат истёк» на действующем сертификате).
    ; Стек задачи NimBLE: в колбэке записи идёт расшифровка кадра привязки,
    ; 4096 байт по умолчанию в притык.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.4.1
    h2zero/NimBLE-Arduino@^1.4.1
    adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32da]
board = esp32dev
board_build.partitions = partitions_speaker.csv
build_flags =
    ${env.build_flags}
    -DDEVICE_PROFILE_DA=1
    ; Эта сборка — домашняя колонка, отдельное изделие. Гоночная гарнитура
    ; DED CORE INTERCOM — другое изделие со своим набором команд: она
    ; собирается на S3 отдельным окружением esp32s3_intercom, а не этим
    ; профилем (см. src/app/Role.h).
    -DSPEAKER_ROLE_HOME=1
    ; Ровно один слот применения 1664 КБ: BLE + WSS + Opus + TFLM в 1408 КБ
    ; не помещаются, а фронт настройки больше не нужен — настройка по Bluetooth.

; Стенд без внешнего ЦАП: звук идёт через встроенный 8-битный ЦАП ESP32 (GPIO25).
; Нужен, чтобы проверить усилитель и динамик, пока не приехал MAX98357A или
; PCM5102A. Микрофон в этом режиме переезжает на I2S1: встроенный ЦАП живёт
; только на I2S0.
[env:esp32da_dac]
extends = env:esp32da
build_flags =
    ${env:esp32da.build_flags}
    -DSPEAKER_OUTPUT_INTERNAL_DAC=1

; Стендовая сборка для проверки привязки без физической кнопки: окно BLE
; открывается сразу при старте. В релиз не попадает, включать только на макете.
[env:esp32da_bench]
extends = env:esp32da
build_flags =
    ${env:esp32da.build_flags}
    -DSPEAKER_BENCH_PAIRING=1

; Диагностика микрофонов: раз в секунду печатает уровень каждого канала.
[env:esp32s3_micdiag]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_MIC_DIAG=1

; Диагностика тракта без единого звука: вместо отсчётов микрофона в кадры
; кладётся эталонный тон 1000 Гц. В динамик он не идёт — проверяется только
; то, что доходит до сервера (темп кадров, разметка частоты при записи).
[env:esp32s3_selftest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_MIC_SELFTEST=1000

; Диагностика ленты: по очереди зажигает цвета и сегменты U, шаг пишет в лог.
; Нужна, чтобы проверить пайку, направление DIN/DOUT и порядок каналов.
[env:esp32s3_ledtest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_LED_SELFTEST=1
    -DSPEAKER_LED_ONLY_TEST=1

; То же, но поток как для 4-канальной ленты SK6812 RGBW.
[env:esp32s3_ledtestw]
extends = env:esp32s3_ledtest
build_flags =
    ${env:esp32s3_ledtest.build_flags}
    -DSPEAKER_LED_RGBW=1

; То же, но 400 кГц: проверка лент с другим таймингом (часть WS2811).
[env:esp32s3_ledtest400]
extends = env:esp32s3_ledtest
build_flags =
    ${env:esp32s3_ledtest.build_flags}
    -DSPEAKER_LED_KHZ400=1

; Стендовая сборка S3: окно привязки открывается при старте, без кнопки.
; Только для макета, в релиз не входит.
[env:esp32s3_bench]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_BENCH_PAIRING=1

; DIY-сборка на классическом ESP32 под боевой dedbox.pro: сервер подписан
; Let's Encrypt, а CA платформы в Secrets.h — стендовый. Без публичных корней
; TLS не сойдётся, и колонка останется без сервера.
[env:esp32da_dedbox]
extends = env:esp32da
build_flags =
    ${env:esp32da.build_flags}
    -DSPEAKER_ALLOW_PUBLIC_ROOTS=1

; Продуктовая плата. Отличия от классического ESP32: 16 МБ флеша, профиль S3
; (BLE-провижининг, OTA-слоты по 3 МБ), задел под аппаратный AEC и медиа.
; PSRAM сейчас выключена — см. комментарий ниже.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_speaker_s3.csv

; Определение платы в PlatformIO описывает N8: 8 МБ флеша и без PSRAM. Наш
; модуль — N16R8, поэтому возможности надо объявить явно, иначе загрузчик
; считает флеш восьмимегабайтным и отвергает таблицу разделов, которая
; доходит до 16 МБ, — плата уходит в бесконечную перезагрузку без сообщений.
board_upload.flash_size = 16MB
board_build.flash_mode = qio

; PSRAM на этой плате ВЫКЛЮЧЕНА намеренно.
;
; Замер на живой колонке: с включённой PSRAM (N16R8, OPI) устройство жило
; секунды — паника в приёмном пути Wi-Fi (sta_input → esf_buf_alloc → сломанные
; списки кучи) и перезагрузки по сторожевому таймеру. Без PSRAM — 4 минуты
; непрерывной работы, ни одного сбоя. Причина в связке «крупные буферы TLS в
; PSRAM + драйвер Wi-Fi» на этом ядре (Arduino 2.0.17 / IDF 4.4): сессионные
; буферы mbedTLS больше 16 КБ уходят в PSRAM, и дальше память разъезжается.
;
; Возвращать PSRAM только вместе с переходом на ядро Arduino 3.x и проверкой
; нагрузочным прогоном (см. env esp32s3_psram — он для этого и оставлен).
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DDEVICE_PROFILE_S3=1
    ; Эта сборка — домашняя колонка, отдельное изделие. Гоночная гарнитура
    ; DED CORE INTERCOM — другое изделие (руки на руле в активной гонке), у неё
    ; свой набор команд и свой образ: она собирается окружением
    ; esp32s3_intercom, а не этим профилем (см. src/app/Role.h).
    -DSPEAKER_ROLE_HOME=1
    ; Пищалка молчит: сигналы мешают отладке (макет стоит на столе, ночь).
    ; Убрать флаг, когда пищалка снова нужна как единственный отклик.
    -DSPEAKER_BEEPER_SILENT=1
    ; Native USB у S3: логи идут в оба порта — в USB и в UART0. На платах с
    ; одним разъёмом UART не выведен, на девките видно и там, и там.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Та же плата с включённой PSRAM. Нужна для будущего AFE (эхоподавление) и
; медиа: им PSRAM требуется по-настоящему. Сейчас НЕ для повседневной работы —
; на этом ядре PSRAM ломает память при TLS (см. комментарий в env:esp32s3).
[env:esp32s3_psram]
extends = env:esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env:esp32s3.build_flags}
    -DBOARD_HAS_PSRAM

; Сборка для боевого dedbox.pro: сервер подписан Let's Encrypt, а CA
; платформы в Secrets.h — стендовый. К пину добавляется ISRG Root X2 из
; net/PublicRoots.h. Для стенда с собственным CA этот env не нужен.
[env:esp32s3_dedbox]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_ALLOW_PUBLIC_ROOTS=1
    ; Яркость 160: на 3.3 В и полной яркости лента берёт почти ампер, шина
    ; просаживается, и в данные проскакивают ошибки — со стороны это выглядит
    ; как случайные цветные вспышки. После перехода на 5 В с 74HCT125 можно
    ; поднимать до 255.
    -DSPEAKER_LED_BRIGHTNESS=160

; Серийная сборка: требует включённого flash-шифрования.
;
; На старте проверяется esp_flash_encryption_enabled(); если шифрование не
; включено (eFuse не прожигались), колонка не открывает привязку и не поднимает
; сеть — иначе ключ устройства и пароль Wi-Fi легли бы в NVS открытым текстом.
;
; Шифрование включается на производстве: сборка с flash encryption + secure
; boot v2, прожиг eFuse и первая загрузка в режиме разработки. Пошагово —
; docs/09-production-security.md. Для макета используйте esp32s3 / esp32da.
[env:esp32s3_prod]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_REQUIRE_SECURE_FLASH=1

; Сборка гоночной гарнитуры DED CORE INTERCOM — отдельного изделия для гонки:
; пилот не снимает руки с руля, а голосом управляет блоком зажигания,
; переключает карты и говорит с агентом. С колонкой общая только база
; прошивки — аудиотракт, связь и привязка; изделие, назначение и набор команд
; у гарнитуры свои, поэтому и образ отдельный. Железо то же (S3 N16R8).
[env:esp32s3_intercom]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSPEAKER_ROLE_INTERCOM=1
    -USPEAKER_ROLE_HOME
