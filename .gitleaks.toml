# Настройки gitleaks. Проверяем историю целиком: секрет, попавший в коммит и
# удалённый следующим коммитом, всё равно опубликован.
[extend]
useDefault = true

[allowlist]
description = "Чужой код и сборочный мусор: детектор энтропии на них шумит"
paths = [
  '''\.pio/''',
  '''node_modules/''',
  '''\.dev/venv/''',
]
